[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buildopt"
version = "0.1.0"
description = "League Build Optimizer: comp-aware rune + build path recommendations, imported into the client during champ select."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "requests>=2.28",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
buildopt = "buildopt.cli:main"

[project.gui-scripts]
buildopt-gui = "buildopt.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
buildopt = ["data/*.json", "data/*.png", "lcu/riotgames.pem"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
